name: Build DAYFORGE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html app.js database.js notifications.js views.js sheets.js utils.js style.css themes.css responsive.css manifest.json icon.svg icon-192.png icon-512.png service-worker.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Set version (versionCode must rise for in-place updates)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      # Android only updates an installed app when the signing key matches.
      # Store a base64 keystore in the repo secret ANDROID_DEBUG_KEYSTORE_BASE64 so every build is signed
      # with the SAME key. Without it, each CI run creates a new random debug key.
      - name: Restore stable signing key (if configured)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "Using stored signing key"; else echo "::warning::No ANDROID_DEBUG_KEYSTORE_BASE64 secret: APK is signed with a new random key and cannot update an installed APK signed with a different key."; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name and verify APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/DAYFORGE-${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-build' }}-${{ github.run_number }}.apk
          ls -l build-output

      - uses: actions/upload-artifact@v4
        with:
          name: DAYFORGE-Android-APK
          path: build-output/*.apk

      - name: Attach APK to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          generate_release_notes: true
